services:
  - type: web
    name: vamoos
    runtime: node
    plan: free
    buildCommand: NPM_CONFIG_PRODUCTION=false npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
      - key: LIVE_SOURCE
        value: live
      - key: HOST
        value: 0.0.0.0
