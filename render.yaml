services:
  # Prefer Docker (Python + Node). If the service stays on Node runtime,
  # Railway Nixpacks (nixpacks.toml) still installs python3.
  - type: web
    name: vamoos
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: LIVE_SOURCE
        value: live
      - key: HOST
        value: 0.0.0.0
      - key: PYTHON_PATH
        value: python3
