services:
  # Docker runtime so Python 3 is available for Dixon-Coles predictions.
  - type: web
    name: vamoos
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: LIVE_SOURCE
        value: live
      - key: HOST
        value: 0.0.0.0
      - key: PYTHON_PATH
        value: python3
